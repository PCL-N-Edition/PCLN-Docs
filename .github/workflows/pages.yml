# GitHub Pages deployment has been retired.
# Production docs.pcln.top is on Cloudflare Pages (project: pcln-docs).
# See: .github/workflows/cloudflare-pages.yml
name: Deploy GitHub Pages (retired)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RETIRED to no-op (deployment moved to Cloudflare Pages)"
        required: true
        type: string

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Retired
        run: |
          echo "GitHub Pages deploy is retired. Use cloudflare-pages.yml for docs.pcln.top."
          if [ "${{ inputs.confirm }}" != "RETIRED" ]; then
            exit 1
          fi
